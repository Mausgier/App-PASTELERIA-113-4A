<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pasteleria - Crear Producto</title>

    <!-- ESTILOS -->
    <!-- Define la apariencia del formulario. -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 80%;
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        button {
            padding: 10px 15px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .acciones {
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="contenedor">

        <h1>Crear Nuevo Producto</h1>

        <!-- FORMULARIO -->
        <!-- Envia los datos mediante el metodo 'POST'. -->
        <form method="POST">

            <!-- CSRF_TOKEN -->
            <!-- Protege el formulario contra solicitudes 'CSRF'. -->
            {% csrf_token %}

            <!-- PRODUCTOFORM -->
            <!-- Muestra los campos del formulario definido en 'forms.py'. -->
            {{ formulario.as_p }}

            <!-- GUARDAR -->
            <button type="submit">
                Guardar Producto
            </button>

        </form>

        <!-- NAVEGACION -->
        <div class="acciones">
            <a href="{% url 'pasteleria_app:listar_productos' %}">
                Volver al Listado de Productos
            </a>
        </div>

    </main>

</body>

</html>
