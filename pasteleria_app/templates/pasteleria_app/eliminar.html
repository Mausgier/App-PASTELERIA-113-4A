{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pastelería - Eliminar Producto</title>

    <!--
        "ESTILOS"
        Define la apariencia de la pagina responsable de solicitar la confirmacion antes de eliminar un producto.
    -->
    <style>

        /*
            "BODY"
            Establece la fuente, el color de fondo y elimina los margenes predeterminados.
        */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /*
            ".CONTENEDOR"
            Presenta la confirmacion de eliminacion dentro de un contenedor blanco y centrado.
            Define su ancho, espacios internos y bordes redondeados.
            'max-width' limita su tamaño maximo.
            'box-sizing: border-box' permite incluir los espacios internos y los bordes dentro del ancho definido para el contenedor.
        */
        .contenedor {
            width: 80%;
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        /*
            "H1"
            Centra el titulo principal de la pagina.
        */
        h1 {
            text-align: center;
        }

        /*
            ".ADVERTENCIA"
            Destaca el mensaje de confirmacion mediante un color rojo y un mayor grosor de la fuente.
        */
        .advertencia {
            color: #a32929;
            font-weight: bold;
        }

        /*
            ".PRODUCTO"
            Presenta la informacion del producto que se desea eliminar.
            Define el color de fondo, los espacios y los bordes redondeados.
        */
        .producto {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }

        /*
            "BUTTON"
            Define la apariencia del boton encargado de confirmar la eliminacion.
            Utiliza un color rojo para diferenciar una accion destructiva.
            'font-family: inherit' utiliza la fuente definida en el elemento padre.
            'font-size' establece un tamaño de letra uniforme con los enlaces de navegacion.
            'cursor: pointer' indica visualmente que el boton puede presionarse.
        */
        button {
            font-family: inherit;
            font-size: 16px;
            padding: 10px 15px;
            background-color: #a32929;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /*
            "BUTTON:HOVER"
            Cambia el color del boton de confirmacion a un rojo mas oscuro cuando el cursor se posiciona sobre el.
            Mantiene la diferenciacion visual de la accion destructiva.
        */
        button:hover {
            background-color: #821f1f;
        }

        /*
            ".ACCIONES"
            Establece un espacio superior para separar la navegacion del formulario de confirmacion.
        */
        .acciones {
            margin-top: 20px;
        }

        /*
            ".CANCELAR"
            Presenta el enlace encargado de cancelar la eliminacion con la misma apariencia de los botones de navegacion.
            Utiliza un color oscuro para diferenciar la cancelacion de la accion destructiva representada por el boton rojo.
        */
        .cancelar {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        /*
            ".CANCELAR:HOVER"
            Cambia el color del enlace de cancelacion cuando el cursor se posiciona sobre el.
        */
        .cancelar:hover {
            background-color: #555555;
        }

    </style>

</head>

<body>

    <!--
        "CONTENEDOR PRINCIPAL"
    -->
    <main class="contenedor">

        <!--
            "TITULO"
        -->
        <h1>Eliminar Producto</h1>

        <!--
            "ADVERTENCIA"
            Informa al usuario que esta por eliminar un producto.
        -->
        <p class="advertencia">¿Estás seguro de que deseas eliminar este producto?</p>

        <!--
            "PRODUCTO"
            Muestra la informacion del producto recibido desde 'views.py'.
        -->
        <section class="producto">

            <p><strong>ID:</strong> <span id="dato-id"></span></p>
            <p><strong>Nombre:</strong> <span id="dato-nombre"></span></p>
            <p><strong>Precio:</strong> <span id="dato-precio"></span></p>
            <p><strong>Stock:</strong> <span id="dato-stock"></span></p>

        </section>

        <!--
            "FORMULARIO"
            Envia una solicitud POST para confirmar la eliminacion.
            https://docs.djangoproject.com/en/5.0/ref/templates/builtins/#url
        -->
        <form id="formEliminar">

            <!--
                "CSRF_TOKEN"
                Protege el formulario contra solicitudes 'CSRF'.
                https://docs.djangoproject.com/en/5.0/howto/csrf/#how-to-use-django-s-csrf-protection
            -->
            {% csrf_token %}

            <!--
                "CONFIRMAR_ELIMINACION"
                Envia el formulario para ejecutar la eliminacion.
            -->
            <button type="submit">Confirmar Eliminación</button>

            <p id="mensaje" role="status"></p>

        </form>

        <!--
            "NAVEGACION"
        -->
        <div class="acciones">

            <!--
                "DETALLE_PRODUCTO"
                Permite regresar a los detalles del producto.
                https://docs.djangoproject.com/en/5.0/ref/templates/builtins/#url
            -->
            <a href="{% url 'pasteleria_app:detalle_producto' id %}" class="cancelar">Cancelar y Volver al Detalle</a>

        </div>

    </main>

    <script src="{% static 'pasteleria_app/api.js' %}"></script>

    <script>
        const idProducto = {{ id }};
        const formulario = document.getElementById('formEliminar');
        const mensaje = document.getElementById('mensaje');
        const boton = formulario.querySelector('button[type="submit"]');

        boton.disabled = true;

        async function cargarProducto() {

            try {
                const producto = await apiProductos(
                    'GET',
                    '/api/productos/' + idProducto + '/'
                );

                document.getElementById('dato-id').textContent = producto.id;
                document.getElementById('dato-nombre').textContent = producto.nombre;
                document.getElementById('dato-precio').textContent =
                    '$' + producto.precio;
                document.getElementById('dato-stock').textContent = producto.stock;

                boton.disabled = false;

            } catch (error) {
                mensaje.textContent = error.message;
            }
        }

        formulario.addEventListener('submit', async function(event) {

            event.preventDefault();
            mensaje.textContent = '';

            boton.disabled = true;

            try {
                await apiProductos(
                    'DELETE',
                    '/api/productos/' + idProducto + '/'
                );

                window.location.href = '/productos/';

            } catch (error) {
                mensaje.textContent = error.message;
                mensaje.style.color = '#a32929';
                boton.disabled = false;
            }
        });

        cargarProducto();
    </script>

</body>

</html>
