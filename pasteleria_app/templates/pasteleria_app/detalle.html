{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pastelería - Detalles del Producto</title>

    <!--
        "ESTILOS"
        Define la apariencia de la pagina responsable de mostrar la informacion detallada de un producto.
    -->
    <style>

        /*
            "BODY"
            Establece la fuente, el color de fondo y elimina los margenes predeterminados.
        */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /*
            ".CONTENEDOR"
            Presenta la informacion del producto dentro de un contenedor blanco y centrado.
            Define su ancho, espacios internos y bordes redondeados.
            'max-width' limita su tamaño maximo.
            'box-sizing: border-box' permite incluir los espacios internos y los bordes dentro del ancho definido para el contenedor.
        */
        .contenedor {
            width: 80%;
            max-width: 700px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        /*
            "H1"
            Centra el titulo principal de la pagina.
        */
        h1 {
            text-align: center;
        }

        /*
            ".INFORMACION"
            Establece un espacio superior entre el titulo y la informacion detallada del producto.
        */
        .informacion {
            margin-top: 30px;
        }

        /*
            ".INFORMACION P"
            Define el tamaño del texto de los parrafos que contienen los datos del producto.
        */
        .informacion p {
            font-size: 18px;
        }

        /*
            ".BOTON"
            Presenta los enlaces de navegacion como botones.
            Define sus dimensiones, colores, espacios y bordes redondeados.
        */
        .boton {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        /*
            ".BOTON-ELIMINAR"
            Diferencia visualmente la accion de eliminacion mediante un color rojo.
            Mantiene las propiedades generales establecidas por la clase '.boton'.
        */
        .boton-eliminar {
            background-color: #a32929;
        }

        /*
            ".BOTON:HOVER"
            Cambia el color de los botones de navegacion cuando el cursor se posiciona sobre ellos.
        */
        .boton:hover {
            background-color: #555555;
        }

        /*
            ".BOTON-ELIMINAR:HOVER"
            Cambia el color del boton de eliminacion a un rojo mas oscuro cuando el cursor se posiciona sobre el.
            Mantiene la diferenciacion visual de la accion destructiva.
        */
        .boton-eliminar:hover {
            background-color: #821f1f;
        }

    </style>

</head>

<body>

    <!--
        "CONTENEDOR PRINCIPAL"
    -->
    <main class="contenedor">

        <!--
            "TITULO"
        -->
        <h1>Detalles del Producto</h1>

        <!--
            "INFORMACION"
            Muestra los datos del producto recibidos desde 'views.py'.
        -->
        <section class="informacion">
            <p><strong>ID:</strong> <span id="dato-id"></span></p>
            <p><strong>Nombre:</strong> <span id="dato-nombre"></span></p>
            <p><strong>Descripción:</strong> <span id="dato-descripcion"></span></p>
            <p><strong>Categoría:</strong> <span id="dato-categoria"></span></p>
            <p><strong>Precio:</strong> <span id="dato-precio"></span></p>
            <p><strong>Stock:</strong> <span id="dato-stock"></span></p>
        </section>

        <p id="mensaje" role="status"></p>

        <!--
            "NAVEGACION"
            Permite acceder a las funciones relacionadas con el producto.
        -->

        <!--
            "EDITAR_PRODUCTO"
            Permite acceder al formulario de edicion del producto actual.
            https://docs.djangoproject.com/en/5.0/ref/templates/builtins/#url
        -->
        <a href="{% url 'pasteleria_app:editar_producto' id %}" class="boton">Editar Producto</a>

        <!--
            "ELIMINAR_PRODUCTO"
            Permite acceder a la pagina de confirmacion de eliminacion del producto actual.
            https://docs.djangoproject.com/en/5.0/ref/templates/builtins/#url
        -->
        <a href="{% url 'pasteleria_app:eliminar_producto' id %}" class="boton boton-eliminar">Eliminar Producto</a>

        <!--
            "LISTAR_PRODUCTOS"
            Permite regresar al listado de productos.
            https://docs.djangoproject.com/en/5.0/ref/templates/builtins/#url
        -->
        <a href="{% url 'pasteleria_app:listar_productos' %}" class="boton">Volver al Listado de Productos</a>

    </main>

    <script src="{% static 'pasteleria_app/api.js' %}"></script>

    <script>
        const idProducto = {{ id }};

        async function cargarDetalle() {

            try {
                const producto = await apiProductos(
                    'GET',
                    '/api/productos/' + idProducto + '/'
                );

                document.getElementById('dato-id').textContent = producto.id;
                document.getElementById('dato-nombre').textContent = producto.nombre;
                document.getElementById('dato-descripcion').textContent =
                    producto.descripcion || 'Sin descripción.';
                document.getElementById('dato-categoria').textContent =
                    nombreCategoria(producto.categoria);
                document.getElementById('dato-precio').textContent =
                    '$' + producto.precio;
                document.getElementById('dato-stock').textContent = producto.stock;

            } catch (error) {
                document.getElementById('mensaje').textContent = error.message;
            }
        }

        cargarDetalle();
    </script>

</body>

</html>
