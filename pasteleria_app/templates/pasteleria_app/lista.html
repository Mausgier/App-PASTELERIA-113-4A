{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pastelería - Productos</title>

    <!--
        "ESTILOS"
        Define la apariencia de la pagina responsable de mostrar el listado de productos.
    -->
    <style>

        /*
            "BODY"
            Establece la fuente, el color de fondo y elimina los margenes predeterminados.
        */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /*
            ".CONTENEDOR"
            Define el ancho del contenido principal y lo centra horizontalmente.
            'max-width' limita su tamaño maximo para evitar que ocupe demasiado espacio.
        */
        .contenedor {
            width: 80%;
            max-width: 1000px;
            margin: 40px auto;
        }

        /*
            "H1"
            Centra el titulo principal de la pagina.
        */
        h1 {
            text-align: center;
        }

        /*
            ".ACCIONES"
            Centra los enlaces de navegacion y establece espacio debajo de ellos.
        */
        .acciones {
            text-align: center;
            margin-bottom: 30px;
        }

        /*
            ".BOTON"
            Presenta los enlaces de navegacion y consulta como botones.
            Define sus dimensiones, colores y bordes redondeados.
        */
        .boton {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        /*
            ".BOTON:HOVER"
            Cambia el color de los botones cuando el cursor se posiciona sobre ellos.
        */
        .boton:hover {
            background-color: #555555;
        }

        /*
            ".PRODUCTO"
            Presenta la informacion de cada producto dentro de una tarjeta blanca.
            Establece espacios internos, separacion entre tarjetas y bordes redondeados.
        */
        .producto {
            background-color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        /*
            ".PRODUCTO H2"
            Elimina el margen superior del nombre del producto dentro de su tarjeta.
        */
        .producto h2 {
            margin-top: 0;
        }

    </style>

</head>

<body>

    <!--
        "CONTENEDOR PRINCIPAL"
    -->
    <main class="contenedor">

        <!--
            "TITULO"
        -->
        <h1>Productos de la Pastelería</h1>

        <!--
            "NAVEGACION"
        -->
        <div class="acciones">

            <!--
                "INICIO"
                Permite regresar a la pagina principal.
                https://docs.djangoproject.com/en/5.0/ref/templates/builtins/#url
            -->
            <a href="{% url 'pasteleria_app:inicio' %}" class="boton">Volver al Inicio</a>

            <!--
                "CREAR_PRODUCTO"
                Permite acceder al formulario de creacion de productos.
                https://docs.djangoproject.com/en/5.0/ref/templates/builtins/#url
            -->
            <a href="{% url 'pasteleria_app:crear_producto' %}" class="boton">Crear Nuevo Producto</a>

        </div>

        <section id="lista-productos">
            <p>Cargando productos...</p>
        </section>

        <p id="mensaje" role="status"></p>

    </main>

    <script src="{% static 'pasteleria_app/api.js' %}"></script>

    <script>
        async function cargarProductos() {

            const contenedor = document.getElementById('lista-productos');
            const mensaje = document.getElementById('mensaje');

            try {
                const productos = await apiProductos(
                    'GET',
                    '/api/productos/'
                );

                contenedor.replaceChildren();

                if (productos.length === 0) {
                    const aviso = document.createElement('p');
                    aviso.textContent = 'No existen productos registrados.';
                    contenedor.appendChild(aviso);
                    return;
                }

                for (const producto of productos) {

                    const tarjeta = document.createElement('article');
                    tarjeta.className = 'producto';

                    const titulo = document.createElement('h2');
                    titulo.textContent = producto.nombre;
                    tarjeta.appendChild(titulo);

                    const campos = [
                        ['Descripción', producto.descripcion || 'Sin descripción.'],
                        ['Categoría', nombreCategoria(producto.categoria)],
                        ['Precio', '$' + producto.precio],
                        ['Stock', producto.stock]
                    ];

                    for (const [etiqueta, valor] of campos) {
                        const parrafo = document.createElement('p');
                        const negrita = document.createElement('strong');

                        negrita.textContent = etiqueta + ': ';
                        parrafo.appendChild(negrita);
                        parrafo.appendChild(
                            document.createTextNode(String(valor))
                        );

                        tarjeta.appendChild(parrafo);
                    }

                    const enlace = document.createElement('a');
                    enlace.className = 'boton';
                    enlace.textContent = 'Ver Detalle';
                    enlace.href = '/productos/' + producto.id + '/';

                    tarjeta.appendChild(enlace);
                    contenedor.appendChild(tarjeta);
                }

            } catch (error) {
                contenedor.replaceChildren();
                mensaje.textContent = error.message;
                mensaje.style.color = '#a32929';
            }
        }

        cargarProductos();
    </script>

</body>

</html>
